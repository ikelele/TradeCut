<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- media-src нужен для превью клипа в визуальной обрезке: без него
       default-src 'none' запрещает загрузку видео в окно. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; media-src 'self' file:">
  <link rel="stylesheet" href="app.css">
  <title>Сделки</title>
</head>
<body>
  <h1>Сделки текущей сессии</h1>
  <p class="hint">Клипы за текущий запуск программы. Выбери сделку, затем что из неё вырезать. Список пополняется сам по мере закрытия сделок.</p>

  <div class="dropzone" id="dropzone">
    Перетащи сюда любой другой видеофайл, чтобы обрезать его в отдельном окне
  </div>

  <div class="trade-list" id="trade-list">
    <div class="empty">Сделок пока нет</div>
  </div>

  <div id="crop-form" class="form-below-list"></div>

  <div class="actions">
    <button type="button" class="primary" id="run" disabled>Вырезать</button>
    <button type="button" class="secondary" id="close">Закрыть</button>
  </div>

  <div class="status" id="status"></div>

  <script src="cropPreview.js"></script>
  <script src="cropForm.js"></script>
  <script src="trades.js"></script>
</body>
</html>
